<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projektpriorisierungsmatrix mit Abteilungen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #27533d 0%, #1a3d2e 100%);
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

h1 {
    color: #27533d;
    margin-bottom: 10px;
    font-size: 28px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 14px;
}

.content-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
}

.input-section, .chart-section {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    width: 100%;
}

.project-form {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
}

label {
    display: block;
    margin-bottom: 5px;
    color: #333;
    font-weight: 500;
    font-size: 13px;
}

input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.3s;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

textarea {
    resize: vertical;
    min-height: 60px;
}

input[type="number"] {
    max-width: 120px;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #27533d;
}

.rating-group {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.rating-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-right: 10px;
}

.btn-primary {
    background: linear-gradient(135deg, #27533d 0%, #1a3d2e 100%);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(39, 83, 61, 0.4);
}

.btn-secondary {
    background: #6c757d;
    color: white;
}

.btn-secondary:hover {
    background: #5a6268;
}

.btn-export {
    background: #28a745;
    color: white;
}

.btn-export:hover {
    background: #218838;
}

#chart {
    width: 100%;
    height: 500px;
    position: relative;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

.legend {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.legend-item {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
}

.legend-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.legend-item.inactive {
    opacity: 0.3;
}

.legend-color {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    margin-right: 8px;
}

.legend-name {
    font-size: 13px;
    font-weight: 500;
}

.projects-list {
    margin-top: 20px;
}

.project-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    border-left: 4px solid #27533d;
}

.project-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.project-info h3 {
    color: #333;
    font-size: 16px;
    margin-bottom: 5px;
}

.project-department {
    display: inline-block;
    background: #27533d;
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 8px;
}

.project-scores {
    display: flex;
    gap: 15px;
    font-size: 12px;
    color: #666;
}

.score-badge {
    background: #e9ecef;
    padding: 4px 8px;
    border-radius: 4px;
}

.project-notes {
    margin-top: 10px;
    padding: 10px;
    background: #f8f9fa;
    border-radius: 6px;
    font-size: 12px;
    color: #555;
    line-height: 1.5;
    white-space: pre-wrap;
}

.project-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.btn-download, .btn-delete, .btn-edit {
    flex: 1 1 auto;
}

.btn-download {
    background: #17a2b8;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.btn-download:hover {
    background: #138496;
}

.btn-delete {
    background: #dc3545;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.btn-delete:hover {
    background: #c82333;
}

.btn-edit {
    background: #ffc107;
    color: #333;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

.btn-edit:hover {
    background: #e0a800;
}

/* MODALS & TOOLTIP bleiben gleich */

/* ----------------------------
   MEDIA QUERIES
---------------------------- */
@media (max-width: 1024px) {
    .content-wrapper {
        grid-template-columns: 1fr !important;
    }
}

@media (max-width: 768px) {
    label {
        font-size: 12px;
    }

    input, select, textarea {
        font-size: 14px;
        padding: 8px;
    }

    input[type="number"] {
        width: 100%;
        max-width: 100%;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Projektpriorisierungsmatrix mit Abteilungen</h1>
        <p class="subtitle">Bewerte deine Projekte und dokumentiere, welche Abteilung sie eingekippt hat</p>
        
        <div class="content-wrapper">
            <div class="input-section">
                <h2 style="margin-bottom: 20px; color: #333; font-size: 20px;">Projekt hinzufügen</h2>
                <div class="project-form">
                    <div class="form-group">
                        <label>Projektname</label>
                        <input type="text" id="projectName" placeholder="z.B. Website Relaunch">
                    </div>
                    
                    <div class="form-group">
                        <label>Abteilung (Projekt eingekippt von)</label>
                        <select id="projectDepartment">
                            <option value="">-- Abteilung wählen --</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Textuelle Bewertung / Notizen</label>
                        <textarea id="projectNotes" placeholder="z.B. Strategische Bedeutung, Risiken, Abhängigkeiten..." rows="3"></textarea>
                    </div>
                    
                    <div class="rating-group">
                        <div class="rating-item">
                            <label>
                                Marktwert
                                <span class="info-icon">i
                                    <span class="tooltip">
                                        <div class="tooltip-title">💰 Marktwert (1-5)</div>
                                        <div class="tooltip-item"><strong>5:</strong> Umsatzeffekt >20%, neuer Markt</div>
                                        <div class="tooltip-item"><strong>4:</strong> Umsatzeffekt 10-20%, stärkt Position</div>
                                        <div class="tooltip-item"><strong>3:</strong> Umsatzeffekt 5-10%, hält mit</div>
                                        <div class="tooltip-item"><strong>2:</strong> Umsatzeffekt <5%, indirekt</div>
                                        <div class="tooltip-item"><strong>1:</strong> Kein Marktwert, rein intern</div>
                                    </span>
                                </span>
                            </label>
                            <input type="number" id="marktwert" min="1" max="5" value="3">
                        </div>
                        <div class="rating-item">
                            <label>
                                Must-have
                                <span class="info-icon">i
                                    <span class="tooltip">
                                        <div class="tooltip-title">⭐ Must-have (1-5)</div>
                                        <div class="tooltip-item"><strong>5:</strong> Existenziell, gesetzliche Pflicht</div>
                                        <div class="tooltip-item"><strong>4:</strong> Sehr wichtig, große Risiken</div>
                                        <div class="tooltip-item"><strong>3:</strong> Wichtig, mittelfristig nötig</div>
                                        <div class="tooltip-item"><strong>2:</strong> Nice-to-have, vorteilhaft</div>
                                        <div class="tooltip-item"><strong>1:</strong> Optional, nicht nötig</div>
                                    </span>
                                </span>
                            </label>
                            <input type="number" id="musthave" min="1" max="5" value="3">
                        </div>
                        <div class="rating-item">
                            <label>
                                Technisch
                                <span class="info-icon">i
                                    <span class="tooltip">
                                        <div class="tooltip-title">🔧 Technisch (1-5)</div>
                                        <div class="tooltip-item"><strong>5:</strong> Hochkomplex, neue Technologie</div>
                                        <div class="tooltip-item"><strong>4:</strong> Komplex, tiefe Systemeingriffe</div>
                                        <div class="tooltip-item"><strong>3:</strong> Mittel, Standardtechnologie</div>
                                        <div class="tooltip-item"><strong>2:</strong> Einfach, bewährte Lösung</div>
                                        <div class="tooltip-item"><strong>1:</strong> Trivial, Standard-Feature</div>
                                    </span>
                                </span>
                            </label>
                            <input type="number" id="technisch" min="1" max="5" value="3">
                        </div>
                        <div class="rating-item">
                            <label>
                                Finanziell
                                <span class="info-icon">i
                                    <span class="tooltip">
                                        <div class="tooltip-title">💵 Finanziell (1-5)</div>
                                        <div class="tooltip-item"><strong>5:</strong> >100k€, externes Budget</div>
                                        <div class="tooltip-item"><strong>4:</strong> 50-100k€, größere Investition</div>
                                        <div class="tooltip-item"><strong>3:</strong> 20-50k€, reguläres Budget</div>
                                        <div class="tooltip-item"><strong>2:</strong> 5-20k€, interne Ressourcen</div>
                                        <div class="tooltip-item"><strong>1:</strong> <5k€, keine Extra-Kosten</div>
                                    </span>
                                </span>
                            </label>
                            <input type="number" id="finanziell" min="1" max="5" value="3">
                        </div>
                        <div class="rating-item">
                            <label>
                                Zeitlich
                                <span class="info-icon">i
                                    <span class="tooltip">
                                        <div class="tooltip-title">⏱️ Zeitlich (1-5)</div>
                                        <div class="tooltip-item"><strong>5:</strong> >6 Monate, mehrjährig</div>
                                        <div class="tooltip-item"><strong>4:</strong> 3-6 Monate, mehrere Sprints</div>
                                        <div class="tooltip-item"><strong>3:</strong> 1-3 Monate, 2-4 Sprints</div>
                                        <div class="tooltip-item"><strong>2:</strong> 2-4 Wochen, 1 Sprint</div>
                                        <div class="tooltip-item"><strong>1:</strong> <2 Wochen, schnell</div>
                                    </span>
                                </span>
                            </label>
                            <input type="number" id="zeitlich" min="1" max="5" value="3">
                        </div>
                    </div>
                    
                    <div class="buttons">
                        <button class="btn btn-primary" onclick="addProject()">✓ Projekt hinzufügen</button>
                        <button class="btn btn-secondary" onclick="clearForm()">✕ Zurücksetzen</button>
                    </div>
                </div>
                
                <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #ddd;">
                    <h3 style="margin-bottom: 15px; color: #333; font-size: 18px;">Abteilungen verwalten</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="newDepartment" placeholder="Neue Abteilung..." style="flex: 1;">
                        <button class="btn btn-primary" onclick="addDepartment()" style="margin: 0;">+ Hinzufügen</button>
                    </div>
                    <div id="departmentsList" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
                </div>
                
                <div class="projects-list" id="projectsList">
                    <h3 style="margin-bottom: 15px; color: #333; font-size: 18px;">Gespeicherte Projekte</h3>
                </div>
            </div>
            
            <div class="chart-section">
                <h2 style="margin-bottom: 20px; color: #333; font-size: 20px;">Priorisierungsmatrix</h2>
                <div id="chart">
                    <canvas id="chartCanvas"></canvas>
                </div>
                <div class="legend" id="legend"></div>
                <div class="buttons">
                    <button class="btn btn-export" onclick="exportToExcel()">📥 Als Excel exportieren</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bearbeiten Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Projekt bearbeiten</h2>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Projektname</label>
                <input type="text" id="editProjectName">
            </div>
            <div class="form-group">
                <label>Abteilung (Projekt eingekippt von)</label>
                <select id="editProjectDepartment">
                    <option value="">-- Abteilung wählen --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Textuelle Bewertung / Notizen</label>
                <textarea id="editProjectNotes" rows="4"></textarea>
            </div>
            <div class="rating-group">
                <div class="rating-item">
                    <label>Marktwert</label>
                    <input type="number" id="editMarktwert" min="1" max="5">
                </div>
                <div class="rating-item">
                    <label>Must-have</label>
                    <input type="number" id="editMusthave" min="1" max="5">
                </div>
                <div class="rating-item">
                    <label>Technisch</label>
                    <input type="number" id="editTechnisch" min="1" max="5">
                </div>
                <div class="rating-item">
                    <label>Finanziell</label>
                    <input type="number" id="editFinanziell" min="1" max="5">
                </div>
                <div class="rating-item">
                    <label>Zeitlich</label>
                    <input type="number" id="editZeitlich" min="1" max="5">
                </div>
            </div>
            <div class="buttons" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveEdit()">✓ Änderungen speichern</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">✕ Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        const projects = [];
        let departments = [];
        const colors = [
            '#27533d', '#3a7d5c', '#4a9d7a', '#2d6b4a', '#1f4d36',
            '#356b50', '#45886b', '#52a67d', '#2f5f45', '#1a4030',
            '#3f7558', '#508c6f', '#62b088', '#2b5840', '#234a37'
        ];
        let canvas, ctx;
        let visibilityState = {};
        let editingProjectId = null;

        window.onload = function() {
            canvas = document.getElementById('chartCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            loadData();
            drawChart();
            window.addEventListener('resize', () => {
                resizeCanvas();
                drawChart();
            });
        };

        function loadData() {
            try {
                const savedProjects = localStorage.getItem('projectMatrix');
                const savedVisibility = localStorage.getItem('projectVisibility');
                const savedDepartments = localStorage.getItem('projectDepartments');
                
               if (savedDepartments) {
                    departments = JSON.parse(savedDepartments);

    // ---- FIX: repariere alte Department-Objekte ----
                    departments = departments.map(d => {
                        if (typeof d === 'object' && d !== null) {
            // Falls altes Format: { name: "Sales" }
                         return d.name || ''; 
                 }
        return d;
    });

    // Leere Einträge entfernen
    departments = departments.filter(d => typeof d === 'string' && d.trim() !== '');
} else {
    departments = ['IT', 'Marketing', 'Vertrieb', 'Produktion', 'HR', 'Finanzen'];
}

                
                updateDepartmentsList();
                updateDepartmentDropdowns();
                
                if (savedProjects) {
                    const loaded = JSON.parse(savedProjects);
                    projects.push(...loaded);
                    updateProjectsList();
                }
                
                if (savedVisibility) {
                    Object.assign(visibilityState, JSON.parse(savedVisibility));
                } else {
                    projects.forEach(p => visibilityState[p.id] = true);
                }
                
                updateLegend();
                
                if (projects.length > 0) {
                    showNotification('✅ Daten erfolgreich geladen!', 'success');
                }
            } catch (error) {
                console.error('Fehler beim Laden:', error);
                showNotification('⚠️ Fehler beim Laden der Daten', 'error');
            }
        }

        function saveData() {
            try {
                localStorage.setItem('projectMatrix', JSON.stringify(projects));
                localStorage.setItem('projectVisibility', JSON.stringify(visibilityState));
                localStorage.setItem('projectDepartments', JSON.stringify(departments));
            } catch (error) {
                console.error('Fehler beim Speichern:', error);
                showNotification('⚠️ Fehler beim Speichern', 'error');
            }
        }

        function addDepartment() {
            const input = document.getElementById('newDepartment');
            const name = input.value.trim();
            
            if (!name) {
                showNotification('⚠️ Bitte gib einen Abteilungsnamen ein!', 'error');
                return;
            }
            
            if (departments.includes(name)) {
                showNotification('⚠️ Diese Abteilung existiert bereits!', 'error');
                return;
            }
            
            departments.push(name);
            saveData();
            updateDepartmentsList();
            updateDepartmentDropdowns();
            input.value = '';
            showNotification('✅ Abteilung hinzugefügt!', 'success');
        }

        function deleteDepartment(name) {
            if (confirm(`Möchtest du die Abteilung "${name}" wirklich löschen?`)) {
                departments = departments.filter(d => d !== name);
                saveData();
                updateDepartmentsList();
                updateDepartmentDropdowns();
                showNotification('🗑️ Abteilung gelöscht', 'success');
            }
        }

        function updateDepartmentsList() {
            const list = document.getElementById('departmentsList');
            list.innerHTML = departments.map(d => `
                <div style="display: inline-flex; align-items: center; background: white; padding: 8px 12px; border-radius: 6px; gap: 8px;">
                    <span style="font-size: 13px; font-weight: 500;">${d}</span>
                    <button onclick="deleteDepartment('${d}')" style="background: none; border: none; color: #dc3545; cursor: pointer; font-size: 16px; padding: 0; line-height: 1;">×</button>
                </div>
            `).join('');
        }

        function updateDepartmentDropdowns() {
            const options = departments.map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById('projectDepartment').innerHTML = '<option value="">-- Abteilung wählen --</option>' + options;
            document.getElementById('editProjectDepartment').innerHTML = '<option value="">-- Abteilung wählen --</option>' + options;
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        function resizeCanvas() {
            const container = document.getElementById('chart');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function addProject() {
            const name = document.getElementById('projectName').value.trim();
            const department = document.getElementById('projectDepartment').value;
            
            if (!name) {
                showNotification('⚠️ Bitte gib einen Projektnamen ein!', 'error');
                return;
            }

            const marktwert = parseInt(document.getElementById('marktwert').value);
            const musthave = parseInt(document.getElementById('musthave').value);
            const technisch = parseInt(document.getElementById('technisch').value);
            const finanziell = parseInt(document.getElementById('finanziell').value);
            const zeitlich = parseInt(document.getElementById('zeitlich').value);
            const notes = document.getElementById('projectNotes').value.trim();

            const impact = (marktwert + musthave) / 2;
            const effort = (technisch + finanziell + zeitlich) / 3;

            const project = {
                id: Date.now(),
                name,
                department,
                notes,
                marktwert,
                musthave,
                technisch,
                finanziell,
                zeitlich,
                impact,
                effort,
                color: colors[projects.length % colors.length]
            };

            projects.push(project);
            visibilityState[project.id] = true;
            
            saveData();
            updateProjectsList();
            updateLegend();
            drawChart();
            clearForm();
            showNotification('✅ Projekt hinzugefügt!', 'success');
        }

        function deleteProject(id) {
            const index = projects.findIndex(p => p.id === id);
            if (index > -1) {
                projects.splice(index, 1);
                delete visibilityState[id];
                saveData();
                updateProjectsList();
                updateLegend();
                drawChart();
                showNotification('🗑️ Projekt gelöscht', 'success');
            }
        }

        function toggleProjectVisibility(id) {
            visibilityState[id] = !visibilityState[id];
            saveData();
            updateLegend();
            drawChart();
        }

        function clearForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('projectDepartment').value = '';
            document.getElementById('projectNotes').value = '';
            document.getElementById('marktwert').value = '3';
            document.getElementById('musthave').value = '3';
            document.getElementById('technisch').value = '3';
            document.getElementById('finanziell').value = '3';
            document.getElementById('zeitlich').value = '3';
        }

        function editProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            editingProjectId = projectId;

            document.getElementById('editProjectName').value = project.name;
            document.getElementById('editProjectDepartment').value = project.department || '';
            document.getElementById('editProjectNotes').value = project.notes || '';
            document.getElementById('editMarktwert').value = project.marktwert;
            document.getElementById('editMusthave').value = project.musthave;
            document.getElementById('editTechnisch').value = project.technisch;
            document.getElementById('editFinanziell').value = project.finanziell;
            document.getElementById('editZeitlich').value = project.zeitlich;

            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            editingProjectId = null;
        }

        function saveEdit() {
            if (!editingProjectId) return;

            const project = projects.find(p => p.id === editingProjectId);
            if (!project) return;

            const name = document.getElementById('editProjectName').value.trim();
            if (!name) {
                showNotification('⚠️ Bitte gib einen Projektnamen ein!', 'error');
                return;
            }

            project.name = name;
            project.department = document.getElementById('editProjectDepartment').value;
            project.notes = document.getElementById('editProjectNotes').value.trim();
            project.marktwert = parseInt(document.getElementById('editMarktwert').value);
            project.musthave = parseInt(document.getElementById('editMusthave').value);
            project.technisch = parseInt(document.getElementById('editTechnisch').value);
            project.finanziell = parseInt(document.getElementById('editFinanziell').value);
            project.zeitlich = parseInt(document.getElementById('editZeitlich').value);

            project.impact = (project.marktwert + project.musthave) / 2;
            project.effort = (project.technisch + project.finanziell + project.zeitlich) / 3;

            saveData();
            updateProjectsList();
            updateLegend();
            drawChart();
            closeEditModal();
            showNotification('✅ Projekt aktualisiert!', 'success');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        };

        function downloadProjectAsPNG(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            const scaleFactor = 3;

            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');
            
            exportCanvas.width = 1920 * scaleFactor;
            exportCanvas.height = 1080 * scaleFactor;

            exportCtx.scale(scaleFactor, scaleFactor);
            
            exportCtx.fillStyle = 'white';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            
            exportCtx.fillStyle = '#27533d';
            exportCtx.font = 'bold 48px Arial';
            exportCtx.fillText(project.name, 60, 80);
            
            if (project.department) {
                exportCtx.fillStyle = '#27533d';
                exportCtx.fillRect(60, 100, 200, 40);
                exportCtx.fillStyle = 'white';
                exportCtx.font = 'bold 24px Arial';
                exportCtx.fillText(project.department, 70, 127);
            }
            
            exportCtx.strokeStyle = '#27533d';
            exportCtx.lineWidth = 3;
            exportCtx.beginPath();
            exportCtx.moveTo(60, 160);
            exportCtx.lineTo(1860, 160);
            exportCtx.stroke();
            
            const matrixX = 60;
            const matrixY = 200;
            const matrixSize = 800;
            
            drawMatrixOnCanvas(exportCtx, matrixX, matrixY, matrixSize, project);
            
            const detailsX = matrixX + matrixSize + 60;
            const detailsY = matrixY;
            
            exportCtx.fillStyle = '#333';
            exportCtx.font = 'bold 32px Arial';
            exportCtx.fillText('Bewertung', detailsX, detailsY);
            
            exportCtx.font = '24px Arial';
            let yOffset = detailsY + 50;
            const lineHeight = 40;
            
            const details = [
                `Marktwert: ${project.marktwert}/5`,
                `Must-have: ${project.musthave}/5`,
                `Technisch: ${project.technisch}/5`,
                `Finanziell: ${project.finanziell}/5`,
                `Zeitlich: ${project.zeitlich}/5`,
                '',
                `Impact: ${project.impact.toFixed(1)}`,
                `Effort: ${project.effort.toFixed(1)}`,
                `Gesamt: ${project.marktwert + project.musthave + project.technisch + project.finanziell + project.zeitlich}/25`
            ];
            
            details.forEach(detail => {
                if (detail === '') {
                    yOffset += lineHeight / 2;
                } else {
                    exportCtx.fillText(detail, detailsX, yOffset);
                    yOffset += lineHeight;
                }
            });
            
            if (project.notes) {
                yOffset += 30;
                exportCtx.fillStyle = '#27533d';
                exportCtx.font = 'bold 28px Arial';
                exportCtx.fillText('Notizen', detailsX, yOffset);
                
                yOffset += 40;
                exportCtx.fillStyle = '#555';
                exportCtx.font = '22px Arial';
                
                const maxWidth = 1920 - detailsX - 60;
                const words = project.notes.split(' ');
                let line = '';
                
                words.forEach(word => {
                    const testLine = line + word + ' ';
                    const metrics = exportCtx.measureText(testLine);
                    
                    if (metrics.width > maxWidth && line !== '') {
                        exportCtx.fillText(line, detailsX, yOffset);
                        line = word + ' ';
                        yOffset += 32;
                    } else {
                        line = testLine;
                    }
                });
                
                if (line !== '') {
                    exportCtx.fillText(line, detailsX, yOffset);
                }
            }
            
            exportCtx.fillStyle = '#999';
            exportCtx.font = '18px Arial';
            exportCtx.fillText('Erstellt mit Projektpriorisierungsmatrix', 60, 1040);
            
            exportCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${project.name.replace(/[^a-z0-9]/gi, '_')}_Priorisierung.png`;
                a.click();
                URL.revokeObjectURL(url);
                showNotification('📥 PNG heruntergeladen!', 'success');
            });
        }

        function drawMatrixOnCanvas(ctx, x, y, size, highlightProject = null) {
            const padding = 80;
            const chartWidth = size - 2 * padding;
            const chartHeight = size - 2 * padding;
            
            ctx.fillStyle = '#f0f8ff';
            ctx.fillRect(x + padding + chartWidth / 2, y + padding, chartWidth / 2, chartHeight / 2);
            
            ctx.fillStyle = '#fff5f5';
            ctx.fillRect(x + padding, y + padding, chartWidth / 2, chartHeight / 2);
            
            ctx.fillStyle = '#f0fff4';
            ctx.fillRect(x + padding + chartWidth / 2, y + padding + chartHeight / 2, chartWidth / 2, chartHeight / 2);
            
            ctx.fillStyle = '#fffbf0';
            ctx.fillRect(x + padding, y + padding + chartHeight / 2, chartWidth / 2, chartHeight / 2);
            
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 5; i++) {
                const gx = x + padding + (chartWidth / 5) * i;
                const gy = y + padding + (chartHeight / 5) * i;
                
                ctx.beginPath();
                ctx.moveTo(gx, y + padding);
                ctx.lineTo(gx, y + size - padding);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(x + padding, gy);
                ctx.lineTo(x + size - padding, gy);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x + padding, y + size - padding);
            ctx.lineTo(x + size - padding, y + size - padding);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + padding, y + padding);
            ctx.lineTo(x + padding, y + size - padding);
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Impact (Marktwert + Must-have)', x + size / 2, y + size - 20);
            
            ctx.save();
            ctx.translate(x + 20, y + size / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Effort (Technisch + Finanziell + Zeitlich)', 0, 0);
            ctx.restore();
            
            ctx.font = '18px Arial';
            ctx.fillStyle = '#666';
            for (let i = 0; i <= 5; i++) {
                const gx = x + padding + (chartWidth / 5) * i;
                const gy = y + padding + (chartHeight / 5) * i;
                
                ctx.textAlign = 'center';
                ctx.fillText(i.toString(), gx, y + size - padding + 30);
                
                ctx.textAlign = 'right';
                ctx.fillText((5 - i).toString(), x + padding - 15, gy + 7);
            }
            
            const projectsToShow = highlightProject ? [highlightProject] : projects.filter(p => visibilityState[p.id]);
            
            projectsToShow.forEach(p => {
                const px = x + padding + (p.impact / 5) * chartWidth;
                const py = y + size - padding - (p.effort / 5) * chartHeight;
                
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(px, py, highlightProject ? 16 : 12, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, px, py - 25);
            });
            
            ctx.fillStyle = '#999';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Quick Wins', x + padding + chartWidth * 0.75, y + padding + 25);
            ctx.fillText('Major Projects', x + padding + chartWidth * 0.25, y + padding + 25);
            ctx.fillText('Fill-Ins', x + padding + chartWidth * 0.75, y + size - padding - 25);
            ctx.fillText('Thankless Tasks', x + padding + chartWidth * 0.25, y + size - padding - 25);
        }

        function updateProjectsList() {
            const list = document.getElementById('projectsList');
            const html = projects.map(p => `
                <div class="project-card" style="border-left-color: ${p.color};">
                    <div class="project-card-header">
                        <div class="project-info">
                            <h3>${p.name}</h3>
                            ${p.department ? `<div class="project-department">📁 ${p.department}</div>` : ''}
                            <div class="project-scores">
                                <span class="score-badge">Impact: ${p.impact.toFixed(1)}</span>
                                <span class="score-badge">Effort: ${p.effort.toFixed(1)}</span>
                                <span class="score-badge">Gesamt: ${p.marktwert + p.musthave + p.technisch + p.finanziell + p.zeitlich}</span>
                            </div>
                        </div>
                    </div>
                    ${p.notes ? `<div class="project-notes">${p.notes}</div>` : ''}
                    <div class="project-actions">
                        <button class="btn-edit" onclick="editProject(${p.id})">✏️ Bearbeiten</button>
                        <button class="btn-download" onclick="downloadProjectAsPNG(${p.id})">📥 Als PNG</button>
                        <button class="btn-delete" onclick="deleteProject(${p.id})">🗑️ Löschen</button>
                    </div>
                </div>
            `).join('');
            
            if (projects.length === 0) {
                list.innerHTML = '<h3 style="margin-bottom: 15px; color: #333; font-size: 18px;">Gespeicherte Projekte</h3><p style="color: #999; text-align: center; padding: 20px;">Noch keine Projekte vorhanden</p>';
            } else {
                list.innerHTML = '<h3 style="margin-bottom: 15px; color: #333; font-size: 18px;">Gespeicherte Projekte</h3>' + html;
            }
        }

        function updateLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = projects.map(p => `
                <div class="legend-item ${!visibilityState[p.id] ? 'inactive' : ''}" onclick="toggleProjectVisibility(${p.id})">
                    <div class="legend-color" style="background: ${p.color};"></div>
                    <span class="legend-name">${p.name}${p.department ? ` (${p.department})` : ''}</span>
                </div>
            `).join('');
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const padding = 60;
            const chartWidth = canvas.width - 2 * padding;
            const chartHeight = canvas.height - 2 * padding;

            ctx.fillStyle = '#f0f8ff';
            ctx.fillRect(padding + chartWidth / 2, padding, chartWidth / 2, chartHeight / 2);
            
            ctx.fillStyle = '#fff5f5';
            ctx.fillRect(padding, padding, chartWidth / 2, chartHeight / 2);
            
            ctx.fillStyle = '#f0fff4';
            ctx.fillRect(padding + chartWidth / 2, padding + chartHeight / 2, chartWidth / 2, chartHeight / 2);
            
            ctx.fillStyle = '#fffbf0';
            ctx.fillRect(padding, padding + chartHeight / 2, chartWidth / 2, chartHeight / 2);

            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const x = padding + (chartWidth / 5) * i;
                const y = padding + (chartHeight / 5) * i;
                
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, canvas.height - padding);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();
            }

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, canvas.height - padding);
            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Impact (Marktwert + Must-have)', canvas.width / 2, canvas.height - 15);
            
            ctx.save();
            ctx.translate(20, canvas.height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Effort (Technisch + Finanziell + Zeitlich)', 0, 0);
            ctx.restore();

            ctx.font = '11px Arial';
            ctx.fillStyle = '#666';
            for (let i = 0; i <= 5; i++) {
                const x = padding + (chartWidth / 5) * i;
                const y = padding + (chartHeight / 5) * i;
                
                ctx.textAlign = 'center';
                ctx.fillText(i.toString(), x, canvas.height - padding + 20);
                
                ctx.textAlign = 'right';
                ctx.fillText((5 - i).toString(), padding - 10, y + 5);
            }

            projects.forEach(p => {
                if (!visibilityState[p.id]) return;
                
                const x = padding + (p.impact / 5) * chartWidth;
                const y = canvas.height - padding - (p.effort / 5) * chartHeight;
                
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#333';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, x, y - 15);
            });

            ctx.fillStyle = '#999';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Quick Wins', padding + chartWidth * 0.75, padding + 20);
            ctx.fillText('Major Projects', padding + chartWidth * 0.25, padding + 20);
            ctx.fillText('Fill-Ins', padding + chartWidth * 0.75, canvas.height - padding - 20);
            ctx.fillText('Thankless Tasks', padding + chartWidth * 0.25, canvas.height - padding - 20);
        }

        function exportToExcel() {
            const templateData = [];
            
            templateData.push(['Projektname', 'Abteilung', 'Marktwert (1-5)', 'Must-have (1-5)', 'Technisch (1-5)', 'Finanziell (1-5)', 'Zeitlich (1-5)', 'Impact (Ø)', 'Effort (Ø)', 'Gesamt', 'Notizen']);
            
            for (let i = 1; i <= 20; i++) {
                templateData.push(['', '', '', '', '', '', '', '', '', '', '']);
            }

            const ws = XLSX.utils.aoa_to_sheet(templateData);
            
            ws['!cols'] = [
                { wch: 25 },
                { wch: 20 },
                { wch: 15 },
                { wch: 15 },
                { wch: 15 },
                { wch: 15 },
                { wch: 15 },
                { wch: 12 },
                { wch: 12 },
                { wch: 12 },
                { wch: 40 }
            ];

            for (let i = 2; i <= 21; i++) {
                ws[`H${i}`] = { f: `IF(OR(C${i}="",D${i}=""),"",(C${i}+D${i})/2)` };
                ws[`I${i}`] = { f: `IF(OR(E${i}="",F${i}="",G${i}=""),"",(E${i}+F${i}+G${i})/3)` };
                ws[`J${i}`] = { f: `IF(A${i}="","",SUM(C${i}:G${i}))` };
            }

            const infoData = [
                ['📊 Projektpriorisierungsmatrix mit Abteilungen - Anleitung'],
                [''],
                ['So verwendest du diese Vorlage:'],
                [''],
                ['1️⃣ Trage in Spalte A den Projektnamen ein'],
                ['2️⃣ Trage in Spalte B die Abteilung ein, die das Projekt eingekippt hat'],
                ['3️⃣ Bewerte jedes Projekt in den Spalten C-G mit 1-5 Punkten:'],
                ['   • Marktwert (1 = niedrig, 5 = hoch)'],
                ['   • Must-have (1 = nice-to-have, 5 = kritisch)'],
                ['   • Technisch (1 = einfach, 5 = komplex)'],
                ['   • Finanziell (1 = günstig, 5 = teuer)'],
                ['   • Zeitlich (1 = schnell, 5 = langwierig)'],
                [''],
                ['4️⃣ Die Spalten H-J werden automatisch berechnet:'],
                ['   • Impact = Durchschnitt von Marktwert + Must-have'],
                ['   • Effort = Durchschnitt von Technisch + Finanziell + Zeitlich'],
                ['   • Gesamt = Summe aller 5 Bewertungen'],
                [''],
                ['5️⃣ Trage optionale Notizen in Spalte K ein'],
                [''],
                ['6️⃣ Erstelle ein Diagramm:'],
                ['   • Markiere die Spalten A, H und I'],
                ['   • Füge ein Punkt-(XY)-Diagramm ein'],
                ['   • X-Achse = Impact (Spalte H)'],
                ['   • Y-Achse = Effort (Spalte I)'],
                [''],
                ['💡 Tipp: So siehst du, welche Abteilung Quick Wins oder Major Projects eingekippt hat!']
            ];

            const wsInfo = XLSX.utils.aoa_to_sheet(infoData);
            wsInfo['!cols'] = [{ wch: 80 }];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, wsInfo, 'Anleitung');
            XLSX.utils.book_append_sheet(wb, ws, 'Projekte');
            
            XLSX.writeFile(wb, 'Projektpriorisierung_mit_Abteilungen.xlsx');
            showNotification('📥 Excel-Datei heruntergeladen!', 'success');
        }
    </script>
